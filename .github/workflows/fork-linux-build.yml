name: "Fork Build (Linux .deb)"

# Unsigned x86_64 .deb for this fork. Download it from the run's artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build.yml"
      - ".github/workflows/fork-linux-build.yml"

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "ubuntu-22.04"
      target: "x86_64-unknown-linux-gnu"
      build-args: "--bundles deb"
      sign-binaries: false
      asset-prefix: "handy-fork"
      upload-artifacts: true
